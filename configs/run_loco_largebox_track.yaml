defaults:
  - robot: g1
  - robot@inspire: inspire
  - policy@loco: unitree_wo_gait
  - policy@largebox: body_hand_distill_largebox
  - policy@stand_track: track
  - motion: largebox_039_v00
  - deployment: sim
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

device: cpu

startup:
  ramp_seconds: 3.0
  blend_seconds: 5.0

handover:
  settle_seconds: 3.0
  min_body_height: 0.72
  max_body_tilt: 0.25
  max_linear_speed: 0.10
  max_angular_speed: 0.30
  to_largebox_seconds: 4.0
  return_settle_seconds: 3.0
  return_max_joint_speed: 0.50
  to_standing_seconds: 5.0
  body_rate_limit: 0.05

recording:
  enabled: true
  seconds: 1200
  directory: logs

env:
  _target_: g1_playground.g1_env.G1Env

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .
