defaults:
  - dds: sim
  - _self_

hydra:
  output_subdir: null
  run:
    dir: .

policy:
  model: models/track/track.onnx

  policy_joint_order: dfs

  history_length: 10
  action_clip: 10.0        # raw action clipped to +-10 before scaling

  reference:
    root_height: 0.76

  ramp_duration: 2.0
  kp_ramp_floor: 0.1

  action_scale:            # 0.25 * effort_limit / kp, per joint
    default: 0.4386
    values:
      ".*_hip_pitch_joint": 0.5475
      ".*_hip_roll_joint": 0.3507
      ".*_hip_yaw_joint": 0.5475
      ".*_knee_joint": 0.3507
      "waist_yaw_joint": 0.5475
      ".*_wrist_pitch_joint": 0.0745
      ".*_wrist_yaw_joint": 0.0745

  default_pos:             # rad
    default: 0.0
    values:
      ".*_hip_pitch_joint": -0.312
      ".*_knee_joint": 0.669
      ".*_ankle_pitch_joint": -0.363
      ".*_shoulder_pitch_joint": 0.2
      "left_shoulder_roll_joint": 0.2
      "right_shoulder_roll_joint": -0.2
      ".*_elbow_joint": 0.6

  kp:                      # N*m/rad
    default: 14.3
