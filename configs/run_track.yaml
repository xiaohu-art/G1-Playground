      ".*_hip_pitch_joint": 40.2
      ".*_hip_roll_joint": 99.1
      ".*_hip_yaw_joint": 40.2
      ".*_knee_joint": 99.1
      ".*_ankle_.*_joint": 28.5
      "waist_yaw_joint": 40.2
      "waist_roll_joint": 28.5
      "waist_pitch_joint": 28.5
      ".*_wrist_pitch_joint": 16.8
      ".*_wrist_yaw_joint": 16.8

  kd:                      # N*m*s/rad
    default: 0.9
