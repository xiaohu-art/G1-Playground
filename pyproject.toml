[project]
name = "g1-playground"
version = "0.1.0"
description = "G1 Playground, a lightweight codebase for gettting started with Unitree's G1 robot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "mujoco>=3.3.0",
    "pygame>=2.6.1",
    "unitree-sdk2py",
    "onnxruntime==1.23.2",
    "hydra-core>=1.3.5",
    "pynput>=1.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g1_playground"]

[tool.uv.sources]
unitree-sdk2py = { path = "../unitree_sdk2_python", editable = true }
